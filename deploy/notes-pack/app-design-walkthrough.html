<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>CCDV-F · D2 Claude Application Design — Visual Walkthrough</title>
<style>
  :root{
    --bg:#0f1117; --panel:#1a1d27; --panel2:#232736; --code:#0b0d13;
    --text:#e8eaf0; --dim:#9aa0b4; --accent:#d97748; --green:#4fa877; --red:#c95b5b;
    --purple:#c98bdb; --blue:#5b9bd9; --yellow:#d9b45b; --border:#2e3345;
  }
  *{box-sizing:border-box; margin:0;}
  body{background:var(--bg); color:var(--text); font-family:'Segoe UI',system-ui,sans-serif;
       min-height:100vh; display:flex; flex-direction:column; align-items:center; padding:22px 16px 60px;}
  a{color:var(--accent);}
  header{text-align:center; margin-bottom:16px;}
  h1{font-size:1.15rem; font-weight:600; letter-spacing:.03em;}
  h1 span{color:var(--accent);}
  .sub{color:var(--dim); font-size:.8rem; margin-top:4px;}

  .rail{display:flex; flex-wrap:wrap; gap:6px; justify-content:center; max-width:940px; margin:10px auto 4px;}
  .rail button{background:var(--panel); color:var(--dim); border:1px solid var(--border); border-radius:999px;
       padding:5px 12px; font-size:.72rem; cursor:pointer; transition:all .15s; white-space:nowrap;}
  .rail button:hover{border-color:var(--accent); color:var(--text);}
  .rail button.active{background:var(--accent); border-color:var(--accent); color:#fff;}
  .rail button.done{color:var(--text); border-color:#3c4256;}
  .rail button.done::before{content:"\2713 "; color:var(--green);}

  main{width:100%; max-width:900px;}
  .view{background:var(--panel); border:1px solid var(--border); border-radius:16px; padding:26px 28px; margin-top:12px;}
  .badge{display:inline-block; font-size:.68rem; letter-spacing:.09em; text-transform:uppercase;
         padding:4px 10px; border-radius:6px; margin-bottom:12px; font-weight:600;}
  .badge.scen{background:rgba(91,155,217,.16); color:var(--blue); border:1px solid rgba(91,155,217,.35);}
  .badge.trust{background:rgba(201,91,91,.16); color:var(--red); border:1px solid rgba(201,91,91,.35);}
  .badge.schema{background:rgba(201,139,219,.16); color:var(--purple); border:1px solid rgba(201,139,219,.35);}
  .badge.ctx{background:rgba(79,168,119,.16); color:var(--green); border:1px solid rgba(79,168,119,.35);}
  .badge.plain{background:var(--panel2); color:var(--dim); border:1px solid var(--border);}
  h2{font-size:1.35rem; font-weight:650; margin-bottom:4px; line-height:1.25;}
  h3{font-size:.96rem; font-weight:650; margin:22px 0 8px; color:var(--text);}
  h4{font-size:.78rem; text-transform:uppercase; letter-spacing:.06em; margin-bottom:6px; color:var(--dim); font-weight:600;}
  .loc{color:var(--dim); font-size:.82rem; margin-bottom:14px;}
  p{line-height:1.62; margin:9px 0; color:#d4d8e4; font-size:.92rem;}
  p.lead{font-size:1rem; color:var(--text);}
  strong{color:#fff;}
  em{color:var(--accent); font-style:normal;}
  code.inl{background:var(--code); border:1px solid var(--border); border-radius:5px; padding:1px 6px;
        font-family:'Cascadia Code','Consolas',monospace; font-size:.82em; color:#cdd3e6;}
  ul{margin:8px 0 8px 2px; padding-left:18px; line-height:1.6; color:#d4d8e4; font-size:.92rem;}
  li{margin:5px 0;}

  .code{background:var(--code); border:1px solid var(--border); border-radius:10px; overflow-x:auto;
        font-family:'Cascadia Code','Consolas','Courier New',monospace; font-size:.8rem; line-height:1.62; margin:10px 0;}
  .ln{display:flex; white-space:pre; min-width:max-content;}
  .ln .gut{width:2.6em; text-align:right; padding:0 12px 0 10px; color:#454b62; user-select:none; flex:none;}
  .ln .src{padding-right:16px; flex:1;}
  .ln.bug{background:rgba(201,91,91,.14);}  .ln.bug .gut{color:var(--red); font-weight:700;}
  .ln.add{background:rgba(79,168,119,.13);} .ln.add .gut{color:var(--green);}
  .ln.ctx{background:rgba(217,119,72,.07);}
  .ln.evil{background:rgba(201,91,91,.2); outline:1px solid rgba(201,91,91,.45); outline-offset:-1px;}
  .t-kw{color:var(--purple);} .t-str{color:#8fbf87;} .t-com{color:#5c6478; font-style:italic;}
  .t-num{color:#d99a5b;} .t-key{color:#7fb3e0;} .t-lit{color:var(--purple);} .t-tag{color:#7fb3e0;}
  .tagline{font-size:.7rem; color:var(--red); margin-left:8px; font-weight:600; letter-spacing:.04em;}
  .tagline.add{color:var(--green);}

  .revwrap{margin:12px 0;}
  .revbtn{background:var(--panel2); color:var(--text); border:1px solid var(--border); border-radius:9px;
      padding:9px 16px; font-size:.83rem; cursor:pointer; transition:all .15s; display:inline-flex; align-items:center; gap:8px;}
  .revbtn:hover{border-color:var(--accent);}
  .revbtn .chev{color:var(--accent); transition:transform .2s;}
  .reveal{display:none; margin-top:12px; padding:16px 18px; border-radius:10px; border:1px solid var(--border);
      background:var(--panel2); animation:fade .25s ease;}
  .reveal.open{display:block;}
  @keyframes fade{from{opacity:0; transform:translateY(-4px);} to{opacity:1; transform:none;}}
  .reveal .oneliner{font-size:.96rem; color:#fff; font-weight:600; line-height:1.5;}

  .callout{border-left:3px solid var(--accent); background:var(--panel2); border-radius:0 8px 8px 0;
      padding:12px 16px; margin:14px 0; font-size:.88rem; line-height:1.6;}
  .callout.warn{border-left-color:var(--red);}
  .callout.good{border-left-color:var(--green);}
  .callout.note{border-left-color:var(--blue);}
  .callout b{color:#fff;}

  table{border-collapse:collapse; width:100%; margin:12px 0; font-size:.83rem;}
  th,td{border:1px solid var(--border); padding:8px 10px; text-align:left; vertical-align:top; line-height:1.5;}
  th{background:var(--panel2); color:var(--text); font-weight:600;}

  .grid{display:grid; grid-template-columns:repeat(auto-fit,minmax(190px,1fr)); gap:10px; margin:14px 0;}
  .card{border:1px solid var(--border); border-radius:10px; padding:12px 14px; background:var(--panel2);}
  .card .n{font-size:.68rem; letter-spacing:.08em; text-transform:uppercase; font-weight:700;}
  .card h5{font-size:.9rem; margin:5px 0 4px;}
  .card p{font-size:.78rem; color:var(--dim); margin:0; line-height:1.5;}

  /* surfaces */
  .surf{display:grid; grid-template-columns:repeat(auto-fit,minmax(230px,1fr)); gap:11px; margin:14px 0;}
  .sf{border:1px solid var(--border); border-radius:11px; padding:13px 15px; background:var(--panel2);}
  .sf .ico{font-size:1.4rem; display:block; margin-bottom:5px;}
  .sf b{font-size:.9rem; display:block; margin-bottom:5px;}
  .sf .where{font-family:'Cascadia Code',monospace; font-size:.76rem; color:#f0b48c; display:block; margin-bottom:6px;}
  .sf p{font-size:.77rem; color:var(--dim); margin:0; line-height:1.5;}

  /* channel classifier */
  .chan{display:grid; grid-template-columns:repeat(auto-fit,minmax(255px,1fr)); gap:9px; margin:14px 0;}
  .ch{border:1px solid var(--border); border-radius:10px; padding:12px 14px; background:var(--panel2);
      cursor:pointer; transition:all .15s;}
  .ch:hover{border-color:var(--accent);}
  .ch .q{font-size:.85rem; line-height:1.5;}
  .ch .v{display:none; margin-top:9px; padding-top:9px; border-top:1px dashed var(--border); font-size:.78rem; line-height:1.5; color:var(--dim);}
  .ch.open .v{display:block;}
  .ch.open.trusted{border-color:rgba(201,139,219,.55); background:rgba(201,139,219,.09);}
  .ch.open.untrusted{border-color:rgba(201,91,91,.5); background:rgba(201,91,91,.09);}
  .ch .lbl{display:inline-block; font-size:.68rem; font-weight:700; letter-spacing:.07em; text-transform:uppercase;
      padding:3px 9px; border-radius:999px; margin-bottom:7px;}
  .ch.trusted .lbl{background:rgba(201,139,219,.2); color:var(--purple); border:1px solid rgba(201,139,219,.45);}
  .ch.untrusted .lbl{background:rgba(201,91,91,.2); color:#f0a5a5; border:1px solid rgba(201,91,91,.5);}
  .ch .hint{font-size:.7rem; color:#5b6178; margin-top:8px;}
  .ch.open .hint{display:none;}
  .tally{font-size:.82rem; color:var(--dim); margin:6px 0 0;} .tally b{color:var(--accent);}

  /* two-panel compare */
  .cmp{display:flex; gap:14px; flex-wrap:wrap;}
  .cmp .col{flex:1; min-width:290px;}
  .cmp .col h4 .x{color:var(--red);} .cmp .col h4 .ok{color:var(--green);}
  .outcome{border-radius:9px; padding:10px 13px; font-size:.8rem; line-height:1.55; margin-top:8px;}
  .outcome.bad{background:rgba(201,91,91,.11); border:1px solid rgba(201,91,91,.38); color:#f0b9b9;}
  .outcome.good{background:rgba(79,168,119,.1); border:1px solid rgba(79,168,119,.35); color:#a7dcbf;}

  /* mechanism drill */
  .drill{border:1px solid var(--border); border-radius:11px; padding:14px 16px; margin:10px 0; background:var(--panel2);}
  .drill .stem{font-size:.88rem; line-height:1.55; margin-bottom:10px;}
  .drill .opts{display:flex; gap:8px; flex-wrap:wrap;}
  .drill .opts button{background:var(--code); color:var(--text); border:1px solid var(--border); border-radius:8px;
      padding:8px 14px; font-size:.79rem; cursor:pointer; font-family:'Cascadia Code',monospace; transition:all .15s;}
  .drill .opts button:hover{border-color:var(--accent);}
  .drill .opts button.right{border-color:var(--green); background:rgba(79,168,119,.15); color:#a7dcbf;}
  .drill .opts button.wrong{border-color:var(--red); background:rgba(201,91,91,.12); color:#f0b9b9;}
  .drill .why{display:none; margin-top:10px; font-size:.82rem; line-height:1.55; color:#d4d8e4;
      border-left:3px solid var(--purple); padding-left:12px;}
  .drill .why.open{display:block;}
  .drill .why b{color:#fff;}

  /* context budget bar */
  .ctxbar{display:flex; height:38px; border:1px solid var(--border); border-radius:9px; overflow:hidden; margin:10px 0 4px;}
  .seg{display:flex; align-items:center; justify-content:center; font-size:.68rem; color:#0b0d13; font-weight:700;
       white-space:nowrap; overflow:hidden;}
  .seg.sys{background:#c98bdb;} .seg.tools{background:#5b9bd9;} .seg.plug{background:#d9b45b;}
  .seg.work{background:#4fa877;} .seg.junk{background:#c95b5b;} .seg.free{background:#232736; color:#5b6178;}
  .leg{display:flex; gap:14px; flex-wrap:wrap; font-size:.73rem; color:var(--dim); margin-bottom:12px;}
  .leg i{display:inline-block; width:10px; height:10px; border-radius:3px; margin-right:5px;}
  .sesctl{display:flex; gap:8px; flex-wrap:wrap; margin:12px 0;}
  .sesctl button{background:var(--panel2); color:var(--text); border:1px solid var(--border); border-radius:8px;
      padding:8px 14px; font-size:.8rem; cursor:pointer;}
  .sesctl button:hover{border-color:var(--accent);}
  .sesctl button.primary{background:var(--accent); border-color:var(--accent); color:#fff;}
  .sesnote{font-size:.82rem; line-height:1.55; padding:10px 13px; border-radius:9px; margin-top:6px;}
  .sesnote.ok{background:rgba(79,168,119,.1); border-left:3px solid var(--green); color:#a7dcbf;}
  .sesnote.warn{background:rgba(217,180,91,.1); border-left:3px solid var(--yellow); color:#e2cd94;}
  .sesnote.bad{background:rgba(201,91,91,.1); border-left:3px solid var(--red); color:#f0b9b9;}

  .choice{display:block; width:100%; text-align:left; background:var(--panel2); color:var(--text);
      border:1px solid var(--border); border-radius:10px; padding:12px 15px; margin:8px 0; font-size:.87rem;
      cursor:pointer; line-height:1.55; transition:all .15s;}
  .choice:hover{border-color:var(--accent);}
  .choice.right{border-color:var(--green); background:rgba(79,168,119,.12);}
  .choice.wrong{border-color:var(--red); background:rgba(201,91,91,.1);}
  .choice .tag{font-weight:700; margin-right:8px; color:var(--dim);}
  .fb{display:none; margin:6px 0 14px; padding:12px 15px; border-radius:10px; font-size:.85rem; line-height:1.6;}
  .fb.open{display:block;}
  .fb.right{background:rgba(79,168,119,.1); border-left:3px solid var(--green);}
  .fb.wrong{background:rgba(201,91,91,.09); border-left:3px solid var(--red);}
  .fb b{color:#fff;}

  .nav{display:flex; justify-content:space-between; align-items:center; max-width:900px; width:100%; margin-top:16px; gap:10px;}
  .nav button{background:var(--panel); color:var(--text); border:1px solid var(--border); border-radius:10px;
      padding:11px 22px; font-size:.88rem; cursor:pointer; transition:all .15s; font-weight:500;}
  .nav button:hover:not(:disabled){border-color:var(--accent);}
  .nav button:disabled{opacity:.3; cursor:not-allowed;}
  .nav button.primary{background:var(--accent); border-color:var(--accent); color:#fff;}
  .progress{color:var(--dim); font-size:.78rem; text-align:center;} .progress b{color:var(--text);}
  .keys{margin-top:22px; color:var(--dim); font-size:.7rem; text-align:center; line-height:1.9;}
  kbd{background:var(--panel2); border:1px solid var(--border); border-radius:4px; padding:1px 6px; font-size:.68rem;}
  .foot{margin-top:8px; color:#5c6478; font-size:.72rem; text-align:center; line-height:1.7; max-width:660px;}
  .foot a{color:var(--dim);}
  .ck{list-style:none; padding-left:0;}
  .ck li{display:flex; align-items:flex-start; gap:9px; margin:8px 0; cursor:pointer;}
  .ck input{margin-top:3px; accent-color:var(--green); flex:none;}
</style>
</head>
<body>
<header>
  <h1>Claude Application Design — <span>Visual Walkthrough</span></h1>
  <div class="sub">CCDV-F · Domain 2 · Claude Application Design (8.6%) · the single biggest skill on the exam</div>
</header>

<div class="rail" id="rail"></div>
<main><div class="view" id="view"></div></main>

<div class="nav">
  <button id="prev">&#8592; Back</button>
  <div class="progress">Step <b id="stepNo">1</b> / <b id="stepTot">7</b><br><span id="stepName"></span></div>
  <button id="next" class="primary">Next &#8594;</button>
</div>

<div class="keys"><kbd>&#8592;</kbd><kbd>&#8594;</kbd> navigate &nbsp;·&nbsp; commit to an answer <em>before</em> you click to reveal</div>
<div class="foot" id="foot"></div>

<script>
const $ = id => document.getElementById(id);
function esc(s){return String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");}
const KW=/^\b(?:def|return|if|elif|else|for|while|in|with|as|not|and|or|is|True|False|None|raise|import|from|class|lambda|try|except|break|continue)\b/;
function pyHi(line){
  let i=0,out="";
  while(i<line.length){
    const rest=line.slice(i); let m;
    if(rest[0]==="#"){ out+='<span class="t-com">'+esc(rest)+'</span>'; break; }
    if((m=rest.match(/^"""[\s\S]*?"""|^"(?:[^"\\]|\\.)*"|^'(?:[^'\\]|\\.)*'/))){ out+='<span class="t-str">'+esc(m[0])+'</span>'; i+=m[0].length; continue; }
    if((m=rest.match(/^<\/?[a-z_]+>/))){ out+='<span class="t-tag">'+esc(m[0])+'</span>'; i+=m[0].length; continue; }
    if((m=rest.match(KW))){ out+='<span class="t-kw">'+esc(m[0])+'</span>'; i+=m[0].length; continue; }
    if((m=rest.match(/^\b\d+\b/))){ out+='<span class="t-num">'+esc(m[0])+'</span>'; i+=m[0].length; continue; }
    out+=esc(line[i]); i++;
  }
  return out;
}
function jsonHi(s){
  let out="",i=0;
  while(i<s.length){
    const rest=s.slice(i); let m;
    if((m=rest.match(/^"(?:[^"\\]|\\.)*"\s*:/))){ out+='<span class="t-key">'+esc(m[0])+'</span>'; i+=m[0].length; continue; }
    if((m=rest.match(/^"(?:[^"\\]|\\.)*"/))){ out+='<span class="t-str">'+esc(m[0])+'</span>'; i+=m[0].length; continue; }
    if((m=rest.match(/^\b(?:true|false|null)\b/))){ out+='<span class="t-lit">'+esc(m[0])+'</span>'; i+=m[0].length; continue; }
    if((m=rest.match(/^\b\d+(?:\.\d+)?\b/))){ out+='<span class="t-num">'+esc(m[0])+'</span>'; i+=m[0].length; continue; }
    out+=esc(s[i]); i++;
  }
  return out;
}
function code(lines){
  let h='<div class="code">';
  for(const l of lines){
    const cls=l.mark?" "+l.mark:"";
    const tag=l.tag?'<span class="tagline'+(l.mark==="add"?" add":"")+'">'+l.tag+'</span>':"";
    h+='<div class="ln'+cls+'"><span class="gut">'+(l.n||"")+'</span><span class="src">'+pyHi(l.t)+tag+'</span></div>';
  }
  return h+'</div>';
}
function P(arr){ return arr.map((t,i)=>({n:i+1,t:t.s!==undefined?t.s:t,mark:t.m,tag:t.g})); }
function reveal(id,btn){
  const el=$(id); el.classList.toggle("open");
  const c=btn.querySelector(".chev"); if(c) c.style.transform=el.classList.contains("open")?"rotate(90deg)":"none";
}

let cur=0; const seen=new Set([0]);
const chOpen=new Set();
let turn=0;

const STEPS=[
 {name:"1 · Three surfaces", r:sSurfaces},
 {name:"2 · Channel map",    r:sChannels},
 {name:"3 · The injection",  r:sInject},
 {name:"4 · Which mechanism",r:sMech},
 {name:"5 · Schema limits",  r:sLimits},
 {name:"6 · Context budget", r:sCtx},
 {name:"7 · Recall",         r:sRecall}
];

/* ---------- 1 ---------- */
function sSurfaces(){
 return `<span class="badge scen">Scenario</span>
 <h2>Meridian — a contract-review assistant</h2>
 <div class="loc">D2 · Claude Application Design &nbsp;·&nbsp; the app every step below refers back to</div>
 <p class="lead">A legal-ops team uploads counterparty contracts. Meridian reads each one against the firm's redlining policy, pulls comparable clauses from a precedent store, and emits a structured findings object that opens tickets in the review queue.</p>
 <p>Three groups touch the same assistant, on three different surfaces — and <em>the same instruction lands differently on each</em>. That is the first design decision.</p>

 <div class="surf">
  <div class="sf"><span class="ico">&#128295;</span><b>The API service</b><span class="where">system parameter</span>
   <p>The production path. Full developer control, nothing implicit — if you did not put it in <code class="inl">system</code>, it is not there.</p></div>
  <div class="sf"><span class="ico">&#128187;</span><b>Claude Code (engineers)</b><span class="where">CLAUDE.md hierarchy + settings.json</span>
   <p>Instructions <em>persist across sessions</em> and the hierarchy merges: enterprise &rarr; user (<code class="inl">~/.claude/</code>) &rarr; project root &rarr; subdirectory.</p></div>
  <div class="sf"><span class="ico">&#128172;</span><b>claude.ai (legal team)</b><span class="where">project instructions · preferences · styles</span>
   <p>Your instructions sit <em>on top of Anthropic's own system prompt</em>, which is also present. You are adding to a stack, not owning it.</p></div>
 </div>

 <div class="callout"><b>The authority gradient:</b> instructions in <code class="inl">system</code> (or CLAUDE.md) carry more weight than text sitting inside user content. That is a design lever, not a security boundary — and it is why the next step matters more than any wording you choose.</div>
 <div class="callout warn"><b>The design rule the whole walkthrough hangs on:</b> trusted instructions and untrusted data must <em>never share a channel</em>. Everything in steps 2 and 3 is that one sentence applied.</div>

 <div class="revwrap">
  <button class="revbtn" onclick="reveal('r1',this)"><span class="chev">&#9654;</span> Why the exam asks about surfaces at all</button>
  <div class="reveal" id="r1">
   <div class="oneliner">A stem that says "the behaviour works in Claude Code but not through the API" is testing where instructions live.</div>
   <p>The engineer's CLAUDE.md conventions are invisible to the API service. If the production path needs the same behaviour, it needs it in <code class="inl">system</code> — copied deliberately and versioned, not assumed.</p>
   <p>Same trap in reverse: behaviour that works on claude.ai and vanishes on the API is often leaning on Anthropic's system prompt, which your service does not have.</p>
  </div>
 </div>`;
}

/* ---------- 2 ---------- */
const CH=[
 {q:"The firm's redlining policy, shipped in the <code class='inl'>system</code> parameter from your repo.", v:"trusted",
  w:"You authored it, it is code-reviewed, it is versioned. This is one of the very few genuinely trusted inputs in the system."},
 {q:"The text extracted from a counterparty's uploaded contract PDF.", v:"untrusted",
  w:"Written by someone outside your organisation for their own purposes. The obvious one — and the one everybody gets right."},
 {q:"A comparable clause retrieved from your <em>own</em> precedent store.", v:"untrusted",
  w:"Retrieved content is data, even from your own store. Somebody put it there, and a retrieval corpus is exactly the thing an attacker poisons once and reaches many times."},
 {q:"The output of your <code class='inl'>lookup_counterparty</code> tool.", v:"untrusted",
  w:"Tool output originates outside your prompt — a third-party API, a database row, a scraped page. It re-enters the context as content, so it gets the same treatment as any other document."},
 {q:"The project's checked-in <code class='inl'>CLAUDE.md</code>.", v:"trusted",
  w:"Versioned, diffable, reviewed on the way in. Note what makes it trusted: not that it is yours, but that a human approved the exact bytes."},
 {q:"Invisible text in the uploaded PDF's metadata and white-on-white layers.", v:"untrusted",
  w:"The nastiest case — untrusted content a human reviewer literally cannot see, extracted verbatim by your parser and handed to the model. Trust follows the channel, never the appearance."}
];
function sChannels(){
 setTimeout(drawCh,20);
 return `<span class="badge trust">Trust</span>
 <h2>Six things arriving in one context window</h2>
 <div class="loc">Decide for each: <b>trusted instruction</b> or <b>untrusted data</b>? Click to check yourself.</div>
 <div class="chan" id="chan"></div>
 <p class="tally" id="tally"></p>

 {stem:"You want to delete the <code class='inl'>try/except json.JSONDecodeError</code> guard wrapped around the response text, because you can rely on the shape.",
  a:"format", why:"<b>Response side &rarr; <code class='inl'>output_config.format</code>.</b> Valid JSON is guaranteed in the response text, so the parse-failure guard is genuinely redundant. The <code class='inl'>stop_reason</code> check is <em>not</em> — see the next step."}

 <h2>Two mechanisms, one word apart on the exam</h2>
 <div class="loc">Meridian needs both. The discriminator is <em>whose object is being constrained</em>.</div>
 <div class="cmp">

function sLimits(){
 return `<span class="badge schema">Reality check</span>
 <h2>A guaranteed schema is not a guaranteed success</h2>
 <div class="loc">Four things the schema does not do for you &mdash; each one a distractor.</div>

 <h3>1 · Two outcomes still return non-conforming output</h3>
 ${code(P([
 {s:'def parse_findings(response):'},
 {s:'    if response.stop_reason == "refusal":'},
 {s:'        # 200 status. You are billed. Refusal text overrides the schema.'},
 {s:'        raise RefusalError("Model declined the request.")', m:"ctx"},
 {s:'    if response.stop_reason == "max_tokens":'},
 {s:'        # Cut off mid-structure — the JSON is incomplete.'},
 {s:'        raise TruncatedError("Raise max_tokens and retry.")', m:"ctx"},
 {s:'    return json.loads(response.content[0].text)   # safe: end_turn', m:"add", g:"ONLY HERE"},
 ]))}
 <div class="callout warn"><b>"Structured outputs guarantee a parse" is the trap.</b> Only <code class="inl">end_turn</code> gives you a complete, schema-valid object. Checking <code class="inl">stop_reason</code> is the right answer, not trusting the schema.</div>
 <p><b>One more non-error surprise:</b> enum casing is not guaranteed — an enum member <code class="inl">"high"</code> may come back as <code class="inl">"High"</code>. Compare case-insensitively, and never define two members that differ only in capitalisation.</p>

 <h3>2 · The schema keyword set is narrower than JSON Schema</h3>
 <p>Unsupported keywords fail the whole request with a <code class="inl">400</code> at call time — they are not silently ignored.</p>
 <table>
  <tr><th>You reach for</th><th>Result</th><th>The schema-legal workaround</th></tr>
  <tr><td><code class="inl">maxItems</code>, <code class="inl">prefixItems</code>, <code class="inl">minItems</code> &gt; 1</td><td><b style="color:#f0a5a5">400</b></td><td>Exactly N items &rarr; N <em>named properties</em> (<code class="inl">choice_a</code>…<code class="inl">choice_d</code>); reassemble into a list in your own code.</td></tr>
  <tr><td><code class="inl">minimum</code> / <code class="inl">maximum</code> on an integer</td><td><b style="color:#f0a5a5">400</b></td><td>Bounded integer &rarr; <code class="inl">"enum": [0, 1, 2, 3]</code>.</td></tr>
  <tr><td><code class="inl">enum</code> on string or integer</td><td><b style="color:#8fd6ac">works</b></td><td>—</td></tr>
 </table>
 <div class="callout note"><b>Why this is bait:</b> the <em>concept</em> — constrain the shape so the model cannot slip — is correct. The trap is assuming every JSON Schema keyword you know from elsewhere is honoured. <em>(Probed against the live API 2026-07-23; re-verify at build time.)</em></div>

 <h3>3 · It is not free</h3>
 <div class="grid">
  <div class="card"><div class="n" style="color:var(--yellow)">Latency</div><h5>First request pays</h5><p>The schema compiles into a grammar before it can constrain anything. Cached <b>24 h</b> from last use — so a stable schema with steady traffic pays <em>once</em>. "Structured outputs are always slower" is false.</p></div>
  <div class="card"><div class="n" style="color:var(--yellow)">Tokens</div><h5>Input goes <em>up</em></h5><p>The API injects a system prompt describing the format, billed like any input. They do not reduce token cost — a distractor claiming savings is wrong.</p></div>
  <div class="card"><div class="n" style="color:var(--red)">Cache</div><h5>Structure changes bust it</h5><p>Changing the schema <em>structure</em> or the <em>set of tools</em> invalidates the grammar cache; changing only a <code class="inl">name</code> or <code class="inl">description</code> does not. Editing <code class="inl">output_config.format</code> also busts the conversation's prompt cache.</p></div>
  <div class="card"><div class="n" style="color:var(--blue)">Limits</div><h5>20 · 24 · 16</h5><p>Max <b>20</b> strict tools, <b>24</b> optional params, <b>16</b> union-type params across all strict schemas in a request. Mark only critical tools strict; prefer <code class="inl">required</code>; flatten nesting.</p></div>
 </div>

 <h3>4 · Two things it cannot be combined with</h3>
 <ul>
  <li><b>Message prefilling &times; JSON outputs</b> — mutually exclusive. Starting the assistant's message and constraining the whole response to a schema cannot both run on one request. A distractor pairing them is wrong on sight.</li>
  <li><b>Citations &times; <code class="inl">output_config.format</code></b> &rarr; <b>400</b>. Citation blocks must interleave with text, which conflicts with a strict JSON shape.</li>
  <li><b>Works fine with</b>: batch processing (still 50% off), streaming, and token counting.</li>
 </ul>
 <div class="callout warn"><b>Meridian handles contracts, so one more:</b> under HIPAA-style handling, the <em>schema is cached separately</em> and is not covered by the same protections as prompts and responses. Keep sensitive values out of property names, enum/const values, and regex — they belong in message content only.</div>`;
}
